name: wespeaker
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - git
  - pip:
      # Every package is pinned in requirements-lock.txt, resolved against the
      # PyPI state of 2025-09-30 and verified from a clean build on 2026-10-07
      # (Ubuntu 22.04, RTX 4080, driver 580.173.02). Direct dependencies and the
      # reasons for their constraints are in requirements.in.
      - -r requirements-lock.txt
